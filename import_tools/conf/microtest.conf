# Headless config for the museum-playtest rebuild.
# Recreated 2026-09-17 after the previous session-scratchpad config was lost.
#
# 2026-09-19 (round 22, real root cause finally found): world.mt's own
# "seed = ..." line (present in museum-playtest/world.mt and the deployed
# copy since round 17) is NOT a setting the engine's fresh-map-meta.txt
# creation path reads AT ALL -- confirmed directly against the engine
# source (src/content/subgames.cpp's initializeWorld: `mgr.setMapSetting
# ("seed", g_settings->get("fixed_map_seed"))`, only when map_meta.txt
# doesn't yet exist -- a DIFFERENT global setting name, "fixed_map_seed",
# not "seed", and world.mt is never even consulted by this code path).
# Every "seed pin" this project attempted before this round (round 16's
# original attempt, round 17's "fix", round 21's "fix") pinned a setting
# the engine was never reading for this purpose -- explains why a full
# wipe silently reseeded EVERY single time regardless, including one
# that happened during this project's OWN headless rebuild (not just the
# owner's real client, which was the previous, incomplete theory).
# Real fix: set the ACTUAL setting the engine reads, here, so any future
# full wipe (map.sqlite/mod_storage.sqlite/map_meta.txt) run through
# this testrig regenerates with the SAME real seed instead of a fresh
# random one. Must match world.mt's seed line and the owner's global
# minetest.conf's fixed_map_seed (both set to the same value, for the
# same reason, in their respective files).
fixed_map_seed = 16532709774040603227
# 2026-09-19 (round 23): same root cause as fixed_map_seed above,
# discovered the same way -- world.mt is parsed into its OWN isolated
# Settings objects for narrow, specific purposes (mod list, backend
# selection -- see src/main.cpp/src/server/mods.cpp) and is NEVER merged
# into g_settings, which is what core.settings:get() (and thus
# mcl_structures/api.lua's own `core.settings:get("mcl_disabled_
# structures")`) actually reads. world.mt's `mcl_disabled_structures =
# large_dripstone_column,...,basalt_column,basalt_pillar` line has
# therefore ALWAYS been inert for this testrig -- confirmed the hard way
# when the exact same basalt_column crash (mcl_terrain_features/init.lua
# :251, see HANDOFF.md's round-22 writeup) happened AGAIN after adding
# it there, twice, on two separate full rebuild attempts. Set here
# instead, the same way fixed_map_seed had to be.
mcl_disabled_structures = large_dripstone_column,large_dripstone_stalagmite,large_dripstone_stalagtite,basalt_column,basalt_pillar,small_end_city,end_shipwreck,end_boat
# 2026-09-19 (round 25): confirmed real data loss -- Fort Alcazar's 488
# real captured mobs (placed successfully at import time per the server
# log) were entirely gone after the owner played the deployed world.
# Root cause: src/mapblock.cpp's onObjectsActivation bulk-DELETES every
# entity in a single mapblock once its stored count exceeds this
# setting (default 256) -- an indiscriminate safety valve that wipes
# real content caught in the same block as whatever pushed the count
# over (most likely mcl_itemframes' own entity-recreation LBM, see
# HANDOFF.md's round-21/25 writeups). Raised here too, matching the
# owner's global minetest.conf, so this project's OWN rebuilds don't
# hit the same limit during the placement pass itself.
# 2026-09-20 (round 26): raised further (5000 wasn't enough, owner hit
# 5525 live) -- see the matching comment in the owner's global
# minetest.conf for the root-cause detail (mcl_itemframes LBM race).
max_objects_per_block = 50000
secure.enable_security = false
server_announce = false
max_users = 1
# Point straight at the kit -- kit fixes (palette.lua/data.lua) apply on next
# rebuild automatically, no extra copy step needed.
spawnimport_lua_import_path = /Users/dara/dev/museum-import-kit/lua_import/
museumloot_stable_seconds = 10
# 2026-09-24: gallery fill's placement pass emerged 4 bboxes sequentially,
# then read frame positions - earlier bboxes' blocks had auto-unloaded
# (~29s default) and get_node returned "ignore", counted as skip_notframe
# (34 frames silently missed on the first 4-base fill). Keep blocks loaded
# through the whole pass. Headless-only setting; harmless for test worlds.
server_unload_unused_data_timeout = 3600

museum_manifest_path = /Users/dara/dev/museum-microtest/museum_manifest.json
museum_target_bases = 4