name = museumloot
description = Post-import chest loot for the 2b2t museum. Per FEATURE-loot.md, stages 1 and 3 only (the LLM-driven stage 2 is deliberately replaced with deterministic local keyword matching -- sign text never goes to a third-party API in this build). Drives the import via spawnimport, waits for it to settle, then fills every container placed by spawnimport with themed loot keyed off nearby sign text.
depends = spawnimport
