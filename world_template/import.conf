# minetest.conf for the headless import server
secure.enable_security = false
server_announce = false
max_users = 1
# Absolute path to the kit's lua_import directory (anvil/nbt/palette/data).
spawnimport_lua_import_path = /root/museum-import-kit/lua_import/
# Absolute path to the manifest.
museum_manifest_path = /root/museum-import-kit/manifest/museum_manifest.json
museum_target_bases = 205
